name: Make audio

# Run this by hand from the Actions tab. It reads OPENAI_API_KEY from the repository secrets,
# creates any missing mp3 files in core/audio and commits them.
# Default engine: free Microsoft neural voices (edge-tts), no key and no cost.
# To use paid OpenAI voices instead, add the secret OPENAI_API_KEY and start the run with engine = openai.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Remake every file (type yes)"
        required: false
        default: "no"
      engine:
        description: "edge (free, default) or openai (paid, needs OPENAI_API_KEY)"
        required: false
        default: "edge"

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate audio
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE: ${{ github.event.inputs.force }}
          TTS_ENGINE: ${{ github.event.inputs.engine }}
        run: |
          pip install edge-tts
          if [ "$FORCE" = "yes" ]; then python tools/make_audio.py --force; else python tools/make_audio.py; fi
      - name: Commit files
        if: always()
        run: |
          git config user.name "audio-bot"
          git config user.email "audio-bot@users.noreply.github.com"
          git add core/audio
          git diff --cached --quiet || git commit -m "Add generated audio"
          git push
